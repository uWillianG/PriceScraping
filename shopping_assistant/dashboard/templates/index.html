{% extends "base.html" %}
{% block content %}
<section class="flow-head">
  <div>
    <p class="step-label">Etapa 1 de 3</p>
    <h1>Escolha uma categoria</h1>
    <p>Comece pelo tipo de produto que você quer monitorar e comparar.</p>
  </div>
</section>

<section class="category-grid">
  {% for category in categories %}
    <a class="category-card" href="/category/{{ category.slug }}">
      <span class="category-name">{{ category.name }}</span>
      <span class="category-description">{{ category.description }}</span>
      <span class="category-examples">{{ category.examples | join(" · ") }}</span>
    </a>
  {% endfor %}
</section>
{% endblock %}
