<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title or "Assistente de Compras" }}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script defer src="https://unpkg.com/lucide@latest"></script>
    <script defer src="{{ url_for('static', path='/icons.js') }}"></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="/">
          <span class="brand-mark" aria-hidden="true"><i data-lucide="scan-search"></i></span>
          <span>Assistente de Compras</span>
        </a>
        <nav class="main-nav" aria-label="Navegação principal">
          <a class="nav-link {{ 'is-active' if request.url.path == '/' or request.url.path.startswith('/category') else '' }}" href="/">
            <i data-lucide="layout-grid"></i>
            <span>Categorias</span>
          </a>
          <a class="nav-link {{ 'is-active' if request.url.path.startswith('/tracked') or request.url.path.startswith('/product') else '' }}" href="/tracked">
            <i data-lucide="radar"></i>
            <span>Monitorados</span>
          </a>
          <a class="nav-link {{ 'is-active' if request.url.path.startswith('/alerts') else '' }}" href="/alerts">
            <i data-lucide="bell-ring"></i>
            <span>Alertas</span>
          </a>
        </nav>
      </div>
    </header>
    <div class="page-shell">
      <main class="page">
        {% block content %}{% endblock %}
      </main>
    </div>
  </body>
</html>
